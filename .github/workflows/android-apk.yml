name: Build 知遥控制台 APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/zhiy-maibot-controller]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include the Android SDK and sdkmanager.
      # setup-android@v3 currently attempts to install the obsolete 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate KernelSU controller script
        run: sh -n app/src/main/assets/zhiy-controller.sh
      - name: Validate embedded QQ-only Ubuntu runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          script = Path("app/src/main/assets/zhiy-controller.sh").read_text()
          blocks = re.findall(r"\$\(cat <<'GUEST'\n(.*?)\nGUEST\n\)", script, re.S)
          assert len(blocks) == 1, f"expected exactly one embedded QQ runner, got {len(blocks)}"
          subprocess.run(["bash", "-n"], input=blocks[0], text=True, check=True)
          for required in ["SNOWLUMA_HOOK_AUTOLOAD=0", "./launcher.sh",
                           "$LAB/vnc.pass", "127.0.0.1:6082",
                           "127.0.0.1:5902", "QQHOME"]:
              assert required in blocks[0], f"missing QQ runner setting: {required}"
          for forbidden in ["src/server.js", "SNOWLUMA_HOOK_AUTOLOAD=1 nohup",
                            "-nopw -forever", "--in-process-gpu", "--no-zygote"]:
              assert forbidden not in blocks[0], f"unexpected command in QQ runner: {forbidden}"
          print("Embedded QQ-only runner: bash syntax and migration checks passed")
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZhiyController-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
